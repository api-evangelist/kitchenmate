aid: kitchenmate
name: KitchenMate
description: KitchenMate is a Toronto-based autonomous retail and workplace food-service
  company that operates 24/7 unattended micro-markets built around two pieces of proprietary
  hardware, a checkout-free Smart Fridge that uses vision sensors to detect what a customer
  removes and bill them automatically, and induction-based Smart Cookers that heat chef-prepared
  entrees in seven to ten minutes. The kiosks are installed in workplaces, condominiums,
  schools, hospitals and other commercial locations, require roughly seven square feet
  plus standard electrical and network connectivity, and accept Visa, Mastercard, Amex,
  Apple Pay and Google Pay at the unit. A companion iOS and Android app carries loyalty
  rewards, dietary filters and meal feedback. The company has since rebranded its platform
  business as Micromart, which markets the same autonomous smart-store technology under
  the tagline "Be anywhere. Sell anything." across a stated 2,000+ locations in North
  America. KitchenMate publishes no public API, developer portal or SDKs; this profile
  captures its identity and probed security posture only.
